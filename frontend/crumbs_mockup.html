<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ugentlig Madplan</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;
    }
    /* Tooltip styling for hover & focus */
    .tooltip-trigger .tooltip-content {
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.15s ease-in-out, visibility 0.15s ease-in-out;
    }
    .tooltip-trigger:hover .tooltip-content,
    .tooltip-trigger:focus-within .tooltip-content {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
<body class="bg-white min-h-screen text-slate-800 antialiased selection:bg-emerald-100 selection:text-emerald-900">

  <!-- Hovedcontainer -->
  <div class="max-w-3xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
    
    <!-- Top Overskrift & Navigation -->
    <header class="flex flex-col sm:flex-row items-center justify-between pb-6 mb-8 border-b border-slate-100 gap-4">
      <div class="flex items-center space-x-3">
        <div class="p-2.5 bg-emerald-50 text-emerald-600 rounded-xl">
          <i data-lucide="utensils" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-slate-900">Madoversigt</h1>
          <p class="text-xs font-medium text-slate-500">Fælles madplan for husstanden</p>
        </div>
      </div>

      <!-- Ugeskifter Kontroller -->
    <!-- Week Switcher Controls -->
    <div class="flex items-center space-x-3 bg-slate-50 p-1.5 rounded-2xl border border-slate-200/80 shadow-sm">
      <button id="prevWeekBtn" aria-label="Forrige uge" class="p-2 rounded-xl bg-white text-slate-600 hover:text-slate-900 hover:bg-slate-100/80 active:scale-95 transition-all duration-150 shadow-sm border border-slate-200/60 flex items-center justify-center">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </button>
      
      <div class="px-4 text-center min-w-[120px]">
        <span id="weekLabel" class="text-base font-bold text-slate-900 tracking-wide block">Uge 44</span>
        <span id="yearLabel" class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">Oktober 2026</span>
      </div>

      <button id="nextWeekBtn" aria-label="Næste uge" class="p-2 rounded-xl bg-white text-slate-600 hover:text-slate-900 hover:bg-slate-100/80 active:scale-95 transition-all duration-150 shadow-sm border border-slate-200/60 flex items-center justify-center">
        <i data-lucide="chevron-right" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

    <!-- Status Banner & Forklaring -->
    <div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
      <div class="flex items-center space-x-2">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Ugentlig Menu</h2>
        <span id="currentWeekBadge" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100/80 text-emerald-800 border border-emerald-200/80 hidden">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          Indeværende uge
        </span>
      </div>

      <!-- Signaturforklaring for statusser -->
      <div class="flex items-center space-x-3 text-[11px] text-slate-500">
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-slate-900 border border-slate-900"></span> Spiser med</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span> Måske</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-slate-200 text-slate-400 text-center text-[8px] leading-none flex items-center justify-center font-bold">✕</span> Spiser ikke</span>
      </div>
    </div>

    <!-- Dagsliste (Mandag - Søndag) -->
    <main id="mealsContainer" class="flex flex-col space-y-4">
      <!-- Retterne genereres dynamisk via JS -->
    </main>

    <!-- Footer Stats / Info -->
    <footer class="mt-12 pt-6 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-400 gap-4">
      <p>© 2026 Fælles Madplan App. Alle måltider skemalagt.</p>
      <div class="flex items-center space-x-4">
        <span class="flex items-center gap-1.5"><i data-lucide="chef-hat" class="w-3.5 h-3.5"></i> Ansvarlig kok</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-slate-900 inline-block"></span> 6 Deltagere (J, M, V, L, Z, G)</span>
      </div>
    </footer>
  </div>

  <script>
    // App state
    const CURRENT_WEEK_NUM = 44; // Indeværende uge
    let selectedWeek = 44;

    // All participants
    const participantsList = ["J", "M", "V", "L", "Z", "G"];

    /**
     * Uge 42 specifikke deltagelsesregler
     */
    const week42Attendance = {
      "Mandag": { J: { status: "yes" }, Z: { status: "yes" }, G: { status: "yes" }, L: { status: "yes" }, V: { status: "yes" }, M: { status: "no" } },
      "Tirsdag": { J: { status: "yes" }, Z: { status: "yes" }, G: { status: "yes" }, L: { status: "yes" }, V: { status: "yes" }, M: { status: "yes" } },
      "Onsdag": { J: { status: "yes" }, Z: { status: "yes" }, G: { status: "yes" }, L: { status: "no" }, V: { status: "maybe" }, M: { status: "no" } },
      "Torsdag": { J: { status: "yes" }, Z: { status: "yes" }, G: { status: "yes" }, L: { status: "no" }, V: { status: "yes" }, M: { status: "yes" } },
      "Fredag": { J: { status: "yes" }, Z: { status: "yes" }, G: { status: "yes" }, L: { status: "no" }, V: { status: "yes" }, M: { status: "yes" } },
      "Lørdag": { J: { status: "yes" }, Z: { status: "yes" }, G: { status: "yes" }, L: { status: "maybe" }, V: { status: "yes" }, M: { status: "yes" } },
      "Søndag": { J: { status: "yes" }, Z: { status: "yes" }, G: { status: "yes" }, L: { status: "no" }, V: { status: "yes" }, M: { status: "no" } }
    };

    /**
     * Uge 43 specifikke deltagelsesregler
     */
    const week43Attendance = {
      "Mandag": { J: { status: "yes" }, Z: { status: "no" }, G: { status: "yes" }, L: { status: "yes" }, V: { status: "yes" }, M: { status: "yes" } },
      "Tirsdag": { J: { status: "yes" }, Z: { status: "yes" }, G: { status: "yes" }, L: { status: "yes" }, V: { status: "yes" }, M: { status: "yes" } },
      "Onsdag": { J: { status: "yes" }, Z: { status: "no" }, G: { status: "no" }, L: { status: "no" }, V: { status: "maybe" }, M: { status: "no", note: "Kan ikke lide" } },
      "Torsdag": { J: { status: "yes" }, Z: { status: "yes" }, G: { status: "yes" }, L: { status: "no" }, V: { status: "yes" }, M: { status: "yes" } },
      "Fredag": { J: { status: "yes" }, Z: { status: "yes" }, G: { status: "yes" }, L: { status: "no" }, V: { status: "yes" }, M: { status: "yes" } },
      "Lørdag": { J: { status: "yes" }, Z: { status: "yes" }, G: { status: "yes" }, L: { status: "yes" }, V: { status: "yes" }, M: { status: "no", note: "Træt af burgere" } },
      "Søndag": { J: { status: "yes" }, Z: { status: "yes" }, G: { status: "yes" }, L: { status: "yes" }, V: { status: "yes" }, M: { status: "yes" } }
    };

    /**
     * Uge 44 specifikke deltagelsesregler
     */
    const week44Attendance = {
      "Mandag": { J: { status: "yes" }, Z: { status: "yes" }, G: { status: "yes" }, L: { status: "yes" }, M: { status: "maybe", note: "Overvejer dagen" }, V: { status: "yes" } },
      "Tirsdag": { J: { status: "yes" }, Z: { status: "yes" }, G: { status: "yes" }, L: { status: "yes" }, M: { status: "maybe", note: "Ser tiden an" }, V: { status: "maybe", note: "Er måske forhindret" } },
      "Onsdag": { J: { status: "yes" }, Z: { status: "yes" }, G: { status: "yes" }, L: { status: "maybe", note: "Måske med" }, M: { status: "no", note: "Træt af kebab" }, V: { status: "yes" } },
      "Torsdag": { J: { status: "yes" }, Z: { status: "yes" }, G: { status: "yes" }, L: { status: "no", note: "Spiser ikke med" }, M: { status: "no", note: "Lider ikke ost" }, V: { status: "yes" } },
      "Fredag": { J: { status: "yes" }, Z: { status: "yes" }, G: { status: "yes" }, L: { status: "yes" }, M: { status: "yes" }, V: { status: "yes" } },
      "Lørdag": { J: { status: "yes" }, Z: { status: "yes" }, G: { status: "yes" }, L: { status: "no", note: "Spiser ikke med" }, M: { status: "yes" }, V: { status: "yes" } },
      "Søndag": { J: { status: "yes" }, Z: { status: "yes" }, G: { status: "yes" }, L: { status: "yes" }, M: { status: "yes" }, V: { status: "yes" } }
    };

    // Standard tilmelding for uge 45 (alle spiser med)
    function getDefaultAttendance() {
      const defaultState = {};
      participantsList.forEach(p => {
        defaultState[p] = { status: "yes" };
      });
      return defaultState;
    }

    // Madplaner for Uge 42, 43, 44 og 45
    const mealPlans = {
      42: [
        { day: "Mandag", meal: "KyllingeBurger", chef: "Lucaz" },
        { day: "Tirsdag", meal: "Hele kyllingelår i fad", chef: "Lucaz" },
        { day: "Onsdag", meal: "Kartoffel Porre Suppe", chef: "Jacob" },
        { day: "Torsdag", meal: "Brændende Kærlighed", chef: "Jacob" },
        { day: "Fredag", meal: "Mørbrad Pande", chef: "Jacob" },
        { day: "Lørdag", meal: "Cæsar Salat", chef: "Jacob" },
        { day: "Søndag", meal: "Foccacia", chef: "Jacob" }
      ],
      43: [
        { day: "Mandag", meal: "Lav Selv Smørrebrød", chef: "Lucaz" },
        { day: "Tirsdag", meal: "Cremet Spinatpasta Med Kylling Og Kalkunbacon", chef: "Lucaz" },
        { day: "Onsdag", meal: "Svampe Suppe", chef: "Jacob" },
        { day: "Torsdag", meal: "Tortillas", chef: "Jacob & Zacharias" },
        { day: "Fredag", meal: "Rissalat Med BBQ Kyllingeunderlår", chef: "Jacob" },
        { day: "Lørdag", meal: "KyllingeBurger", chef: "Jacob" },
        { day: "Søndag", meal: "SkinkePizza", chef: "Jacob" }
      ],
      44: [
        { day: "Mandag", meal: "Pestopasta med kyllingeschnitzel", chef: "Lucaz" },
        { day: "Tirsdag", meal: "Chicken Diane", chef: "Lucaz" },
        { day: "Onsdag", meal: "Pita Kebab", chef: "Jacob" },
        { day: "Torsdag", meal: "Pasta Bolognese", chef: "Jacob" },
        { day: "Fredag", meal: "SkinkeSchnitzel", chef: "Jacob" },
        { day: "Lørdag", meal: "ClubSandwich", chef: "Jacob" },
        { day: "Søndag", meal: "Kyllinge Bagels", chef: "Jacob" }
      ],
      45: [
        { day: "Mandag", meal: "Chefs choice", chef: "Lucaz" },
        { day: "Tirsdag", meal: "Chefs choice", chef: "Lucaz" },
        { day: "Onsdag", meal: "Ciabatta", chef: "Jacob" },
        { day: "Torsdag", meal: "Risengrød", chef: "Marlene" },
        { day: "Fredag", meal: "Butter Chicken", chef: "Jacob" },
        { day: "Lørdag", meal: "Tomatsuppe", chef: "Jacob" },
        { day: "Søndag", meal: "Peperoni pizza", chef: "Jacob" }
      ]
    };

    // Hent deltagelse for en given uge og dag
    function getDayAttendance(weekNum, dayName) {
      if (weekNum === 42) {
        return week42Attendance[dayName] || getDefaultAttendance();
      }
      if (weekNum === 43) {
        return week43Attendance[dayName] || getDefaultAttendance();
      }
      if (weekNum === 44) {
        return week44Attendance[dayName] || getDefaultAttendance();
      }
      return getDefaultAttendance();
    }

    // Render funktion
    function renderWeek(weekNum) {
      document.getElementById("weekLabel").textContent = `Uge ${weekNum}`;
      
      const mealsContainer = document.getElementById("mealsContainer");
      mealsContainer.innerHTML = "";

      const currentPlan = mealPlans[weekNum] || mealPlans[44];

      currentPlan.forEach((item) => {
        // KUN grøn fremhævelse hvis det er Mandag OG indeværende uge (Uge 44)
        const isCurrentWeekMonday = (weekNum === CURRENT_WEEK_NUM && item.day === "Mandag");
        
        const cardClasses = isCurrentWeekMonday
          ? "border-2 border-emerald-500 bg-[#f7fee7] shadow-md shadow-emerald-500/10"
          : "border border-slate-200/90 bg-slate-50/40 hover:bg-slate-50 shadow-sm";

        const card = document.createElement("div");
        card.className = `p-5 sm:p-6 rounded-2xl transition-all duration-200 flex flex-col justify-between ${cardClasses}`;

        const dayAttendance = getDayAttendance(weekNum, item.day);

        // Generer avatar cirkler med status & tooltips
        const participantsHTML = participantsList.map(initial => {
          const info = dayAttendance[initial] || { status: "yes" };
          const status = info.status;
          const note = info.note ? ` (${info.note})` : "";

          let circleStyle = "";
          let tooltipText = "";

          if (status === "yes") {
            circleStyle = "bg-slate-900 text-white border border-slate-900";
            tooltipText = `${initial}: Spiser med${note}`;
          } else if (status === "maybe") {
            circleStyle = "bg-amber-400 text-slate-900 font-extrabold border-2 border-amber-500 ring-2 ring-amber-100";
            tooltipText = `${initial}: Måske${note}`;
          } else { // 'no'
            circleStyle = "bg-slate-200 text-slate-400 line-through border border-slate-300 opacity-60";
            tooltipText = `${initial}: Spiser ikke med${note}`;
          }

          return `
            <div class="tooltip-trigger relative inline-block" tabindex="0">
              <div class="w-7 h-7 rounded-full ${circleStyle} flex items-center justify-center shadow-sm transition-transform cursor-pointer hover:scale-110">
                <span class="text-xs font-bold leading-none">${initial}</span>
              </div>
              <div class="tooltip-content absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-2.5 py-1 bg-slate-900 text-white text-[11px] font-medium rounded-lg whitespace-nowrap shadow-xl z-20 pointer-events-none">
                ${tooltipText}
                <div class="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-slate-900"></div>
              </div>
            </div>
          `;
        }).join("");

        card.innerHTML = `
          <!-- Top Row: Dag og status badge -->
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center space-x-2">
              <span class="text-xs font-extrabold uppercase tracking-wider ${isCurrentWeekMonday ? 'text-emerald-800' : 'text-slate-400'}">
                ${item.day}
              </span>
              ${isCurrentWeekMonday ? `
                <span class="px-2 py-0.5 text-[10px] font-bold bg-emerald-600 text-white rounded-md tracking-wide flex items-center gap-1">
                  <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                  I DAG
                </span>
              ` : ''}
            </div>
            <i data-lucide="utensils-crossed" class="w-4 h-4 ${isCurrentWeekMonday ? 'text-emerald-600' : 'text-slate-300'}"></i>
          </div>

          <!-- Middle Row: Ret overskrift -->
          <div class="mb-5">
            <h3 class="text-lg sm:text-xl font-bold ${isCurrentWeekMonday ? 'text-slate-900' : 'text-slate-800'} tracking-tight leading-snug">
              ${item.meal}
            </h3>
          </div>

          <!-- Bottom Row: Kok og Deltagere -->
          <div class="flex items-center justify-between pt-3 border-t ${isCurrentWeekMonday ? 'border-emerald-200/80' : 'border-slate-200/60'}">
            
            <!-- Venstre: Kok -->
            <div class="flex items-center space-x-2">
              <div class="w-6.5 h-6.5 rounded-full ${isCurrentWeekMonday ? 'bg-emerald-200 text-emerald-900' : 'bg-slate-200 text-slate-700'} flex items-center justify-center">
                <i data-lucide="chef-hat" class="w-3.5 h-3.5"></i>
              </div>
              <div class="text-xs">
                <span class="text-slate-400 font-medium">Kok: </span>
                <span class="font-bold text-slate-900">${item.chef}</span>
              </div>
            </div>

            <!-- Højre: Deltagere -->
            <div class="flex items-center space-x-1 sm:space-x-1.5">
              ${participantsHTML}
            </div>
          </div>
        `;

        mealsContainer.appendChild(card);
      });

      // Genindlæs Lucide ikoner
      lucide.createIcons();
    }

    // Navigation Knapper
    document.getElementById("prevWeekBtn").addEventListener("click", () => {
      if (selectedWeek > 42) {
        selectedWeek--;
        renderWeek(selectedWeek);
      }
    });

    document.getElementById("nextWeekBtn").addEventListener("click", () => {
      if (selectedWeek < 45) {
        selectedWeek++;
        renderWeek(selectedWeek);
      }
    });

    // Initialisering ved indlæsning
    window.onload = function() {
      renderWeek(selectedWeek);
    };
  </script>
</body>
</html>
