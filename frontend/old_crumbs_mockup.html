<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Meal Plan</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;
    }
  </style>
</head>
<body class="bg-white min-h-screen text-slate-800 antialiased selection:bg-emerald-100 selection:text-emerald-900">

  <!-- Main Container -->
  <div class="max-w-3xl mx-auto px-4 py-8 sm:px-6 lg:px-8">

    <!-- Top Header -->
    <header class="flex flex-col sm:flex-row items-center justify-between pb-6 mb-8 border-b border-slate-100 gap-4">
      <div class="flex items-center space-x-3">
        <div class="p-2.5 bg-emerald-50 text-emerald-600 rounded-xl">
          <i data-lucide="utensils" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-slate-900">Weekly Table</h1>
          <p class="text-xs font-medium text-slate-500">Shared family & group meal schedule</p>
        </div>
      </div>

      <!-- Week Switcher Controls -->
      <div class="flex items-center space-x-3 bg-slate-50 p-1.5 rounded-2xl border border-slate-200/80 shadow-sm">
        <button id="prevWeekBtn" class="p-2 rounded-xl bg-white text-slate-600 hover:text-slate-900 hover:bg-slate-100/80 active:scale-95 transition-all duration-150 shadow-sm border border-slate-200/60 flex items-center justify-center">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>

        <div class="px-4 text-center min-w-[110px]">
          <span id="weekLabel" class="text-base font-bold text-slate-900 tracking-wide block">Week 43</span>
          <span id="yearLabel" class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">Oct 2026</span>
        </div>

        <button id="nextWeekBtn" class="p-2 rounded-xl bg-white text-slate-600 hover:text-slate-900 hover:bg-slate-100/80 active:scale-95 transition-all duration-150 shadow-sm border border-slate-200/60 flex items-center justify-center">
          <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
      </div>
    </header>

    <!-- Today Banner Subheading -->
    <div class="mb-6 flex items-center justify-between">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Weekly Menu Plan</h2>
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-100/60 text-emerald-800 border border-emerald-200/60">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        Today: Monday
      </span>
    </div>

    <!-- Stacked Days List -->
    <main id="mealsContainer" class="flex flex-col space-y-4">
      <!-- Meals will be populated dynamically via JavaScript -->
    </main>

    <!-- Footer Stats / Info -->
    <footer class="mt-12 pt-6 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-400 gap-4">
      <p>© 2026 Meal Planner App. All meals scheduled.</p>
      <div class="flex items-center space-x-4">
        <span class="flex items-center gap-1.5"><i data-lucide="user" class="w-3.5 h-3.5"></i> Chef Assigned</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-slate-900 inline-block"></span> 6 Participants</span>
      </div>
    </footer>
  </div>

  <script>
    // State management
    let currentWeek = 43;
    const year = 2026;

    // Participant initials required: J, M, V, L, Z, G
    const participants = ["J", "M", "V", "L", "Z", "G"];

    // Sample weekly menus database
    const mealPlans = {
      42: [
        { day: "Monday", meal: "Slow-Cooked Beef Stew with Root Vegetables", chef: "Lucaz", isToday: false },
        { day: "Tuesday", meal: "Pan-Seared Salmon with Asparagus & Lemon Butter", chef: "Lucaz", isToday: false },
        { day: "Wednesday", meal: "Classic Lasagna Bolognese", chef: "Jacob", isToday: false },
        { day: "Thursday", meal: "Chicken Tikka Masala with Garlic Naan", chef: "Jacob", isToday: false },
        { day: "Friday", meal: "Smash Burgers with Sweet Potato Fries", chef: "Jacob", isToday: false },
        { day: "Saturday", meal: "Creamy Mushroom & Truffle Risotto", chef: "Jacob", isToday: false },
        { day: "Sunday", meal: "Sunday Roast Pork with Applesauce & Gravy", chef: "Jacob", isToday: false }
      ],
      43: [
        { day: "Monday", meal: "Creamy Tuscan Chicken & Fettuccine Pasta", chef: "Lucaz", isToday: true },
        { day: "Tuesday", meal: "Homemade Margherita & Prosciutto Pizza", chef: "Lucaz", isToday: false },
        { day: "Wednesday", meal: "Authentic Mexican Street Tacos with Salsa Verde", chef: "Jacob", isToday: false },
        { day: "Thursday", meal: "Teriyaki Glazed Salmon Rice Bowl", chef: "Jacob", isToday: false },
        { day: "Friday", meal: "Thai Green Curry with Jasmine Rice", chef: "Jacob", isToday: false },
        { day: "Saturday", meal: "Grilled Ribeye Steaks with Herb Butter", chef: "Jacob", isToday: false },
        { day: "Sunday", meal: "Slow-Roasted Herb Lamb with Potatoes", chef: "Jacob", isToday: false }
      ],
      44: [
        { day: "Monday", meal: "Lemon Herb Baked Cod with Quinoa Salad", chef: "Lucaz", isToday: false },
        { day: "Tuesday", meal: "Smoky Pulled Pork Bowls with Slaw", chef: "Lucaz", isToday: false },
        { day: "Wednesday", meal: "Creamy Butternut Squash Soup & Grilled Cheese", chef: "Jacob", isToday: false },
        { day: "Thursday", meal: "Crispy Chicken Parmesan with Marinara", chef: "Jacob", isToday: false },
        { day: "Friday", meal: "Fish Tacos with Mango Salsa", chef: "Jacob", isToday: false },
        { day: "Saturday", meal: "Greek Souvlaki Platter with Tzatziki", chef: "Jacob", isToday: false },
        { day: "Sunday", meal: "Traditional Shepherd's Pie", chef: "Jacob", isToday: false }
      ]
    };

    // Default meals for weeks without explicit data
    function getGenericWeekData(weekNum) {
      return [
        { day: "Monday", meal: `Chef's Choice Special (Week ${weekNum})`, chef: "Lucaz", isToday: false },
        { day: "Tuesday", meal: "Gourmet Pasta Bake & Garlic Bread", chef: "Lucaz", isToday: false },
        { day: "Wednesday", meal: "Fresh Garden Stir-fry with Tofu/Chicken", chef: "Jacob", isToday: false },
        { day: "Thursday", meal: "Mediterranean Chicken & Orzo Bowl", chef: "Jacob", isToday: false },
        { day: "Friday", meal: "Artisanal Flatbreads & Dips", chef: "Jacob", isToday: false },
        { day: "Saturday", meal: "Weekend BBQ & Grilled Skewers", chef: "Jacob", isToday: false },
        { day: "Sunday", meal: "Comforting Vegetable Stew & Crusty Bread", chef: "Jacob", isToday: false }
      ];
    }

    // Render Function
    function renderWeek(weekNum) {
      document.getElementById("weekLabel").textContent = `Week ${weekNum}`;

      const mealsContainer = document.getElementById("mealsContainer");
      mealsContainer.innerHTML = "";

      const currentPlan = mealPlans[weekNum] || getGenericWeekData(weekNum);

      currentPlan.forEach((item) => {
        // Build card HTML
        const card = document.createElement("div");

        // Highlight logic for Monday (green outline + pale lime inside)
        const isHighlight = item.day === "Monday";

        const cardClasses = isHighlight
          ? "border-2 border-emerald-500 bg-[#f4fbf4] shadow-md shadow-emerald-500/5"
          : "border border-slate-200/90 bg-slate-50/50 hover:bg-slate-50 shadow-sm";

        card.className = `p-5 sm:p-6 rounded-2xl transition-all duration-200 flex flex-col justify-between ${cardClasses}`;

        // Participants Avatars HTML
        const participantsHTML = participants.map(initial => `
          <div class="w-7 h-7 rounded-full bg-slate-900 flex items-center justify-center shadow-sm hover:scale-110 transition-transform cursor-default">
            <span class="text-xs font-bold text-white leading-none">${initial}</span>
          </div>
        `).join("");

        card.innerHTML = `
          <!-- Top Row: Day Name & Tag -->
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center space-x-2">
              <span class="text-xs font-extrabold uppercase tracking-wider ${isHighlight ? 'text-emerald-800' : 'text-slate-400'}">
                ${item.day}
              </span>
              ${isHighlight ? `
                <span class="px-2 py-0.5 text-[10px] font-bold bg-emerald-600 text-white rounded-md tracking-wide">
                  CURRENT DAY
                </span>
              ` : ''}
            </div>
            <i data-lucide="utensils-crossed" class="w-4 h-4 ${isHighlight ? 'text-emerald-500' : 'text-slate-300'}"></i>
          </div>

          <!-- Middle Row: Meal Title -->
          <div class="mb-5">
            <h3 class="text-lg sm:text-xl font-bold ${isHighlight ? 'text-slate-900' : 'text-slate-800'} tracking-tight leading-snug">
              ${item.meal}
            </h3>
          </div>

          <!-- Bottom Row: Chef Info & Participants -->
          <div class="flex items-center justify-between pt-3 border-t ${isHighlight ? 'border-emerald-200/60' : 'border-slate-200/60'}">

            <!-- Left: Chef Name -->
            <div class="flex items-center space-x-2">
              <div class="w-6 h-6 rounded-full ${isHighlight ? 'bg-emerald-200 text-emerald-800' : 'bg-slate-200 text-slate-700'} flex items-center justify-center">
                <i data-lucide="chef-hat" class="w-3.5 h-3.5"></i>
              </div>
              <div class="text-xs">
                <span class="text-slate-400 font-medium">Chef: </span>
                <span class="font-bold text-slate-900">${item.chef}</span>
              </div>
            </div>

            <!-- Right: Initials Badges -->
            <div class="flex items-center -space-x-1.5 overflow-hidden">
              ${participantsHTML}
            </div>
          </div>
        `;

        mealsContainer.appendChild(card);
      });

      // Re-initialize Lucide icons for dynamically added content
      lucide.createIcons();
    }

    // Event Listeners for Switcher
    document.getElementById("prevWeekBtn").addEventListener("click", () => {
      currentWeek--;
      renderWeek(currentWeek);
    });

    document.getElementById("nextWeekBtn").addEventListener("click", () => {
      currentWeek++;
      renderWeek(currentWeek);
    });

    // Initial Render
    window.onload = function() {
      renderWeek(currentWeek);
    };
  </script>
</body>
</html>
